<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-City</title>
<!--
	Z-City loading screen (sv_loadingurl). Garry's Mod may show this in an old
	embedded browser, so the CSS avoids variables/grid/clamp and the script is ES5.
	Garry's Mod calls: GameDetails, SetFilesTotal, SetFilesNeeded, DownloadingFile, SetStatusChanged.
-->
<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
	body {
		background: #07080a;
		color: #eef0f3;
		font-family: "Malgun Gothic", "맑은 고딕", "Noto Sans KR", "Segoe UI", Arial, sans-serif;
	}
	#bg {
		position: absolute; left: 0; top: 0; right: 0; bottom: 0;
		background: #07080a;
		background-image: -webkit-radial-gradient(18% 22%, circle, rgba(150, 28, 28, 0.35), rgba(7, 8, 10, 0) 45%),
			-webkit-radial-gradient(85% 90%, circle, rgba(200, 150, 60, 0.12), rgba(7, 8, 10, 0) 40%);
		background-image: radial-gradient(circle at 18% 22%, rgba(150, 28, 28, 0.35), rgba(7, 8, 10, 0) 45%),
			radial-gradient(circle at 85% 90%, rgba(200, 150, 60, 0.12), rgba(7, 8, 10, 0) 40%);
	}
	#scan {
		position: absolute; left: 0; top: 0; right: 0; bottom: 0;
		background-image: -webkit-linear-gradient(top, rgba(255, 255, 255, 0.025) 1px, rgba(0, 0, 0, 0) 1px);
		background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, rgba(0, 0, 0, 0) 1px);
		background-size: 100% 4px;
	}
	#wrap { position: absolute; left: 6%; right: 6%; top: 9%; bottom: 8%; }

	#brand { font-size: 84px; font-weight: 800; letter-spacing: 6px; line-height: 1; color: #f4f5f7; }
	#brand span { color: #c8312f; }
	#tagline { margin-top: 10px; font-size: 18px; color: #9aa1ad; letter-spacing: 1px; }

	#details { margin-top: 36px; }
	.detail { display: inline-block; margin: 0 34px 12px 0; vertical-align: top; }
	.detail .label { font-size: 12px; color: #7d8592; letter-spacing: 2px; text-transform: uppercase; }
	.detail .value { margin-top: 4px; font-size: 22px; color: #e9ecf1; }

	#tipbox {
		position: absolute; left: 0; right: 0; bottom: 120px;
		padding: 20px 24px;
		border-left: 4px solid #c8312f;
		background: rgba(14, 16, 20, 0.82);
	}
	#tiptitle { font-size: 13px; color: #d4a24a; letter-spacing: 2px; }
	#tip { margin-top: 8px; font-size: 21px; line-height: 1.5; color: #e2e5ea; min-height: 32px;
		-webkit-transition: opacity 0.5s; transition: opacity 0.5s; }

	#bottom { position: absolute; left: 0; right: 0; bottom: 0; }
	/* Long workshop lines stop before the percent/stage text on the right. */
	#status { margin-right: 340px; font-size: 16px; color: #c9ced6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#file { margin-top: 4px; font-size: 13px; color: #737b88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#bar { position: relative; margin-top: 12px; height: 8px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
	#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #c8312f;
		-webkit-transition: width 0.4s; transition: width 0.4s; }
	#percent { position: absolute; right: 0; top: 0; font-size: 16px; color: #c9ced6; }
	#hint { margin-top: 10px; font-size: 13px; color: #6f7784; }

	#collection { position: absolute; right: 0; top: 0; width: 260px; text-align: center; }
	#qr { display: block; margin: 0 auto; width: 210px; height: 210px; border: 1px solid rgba(255, 255, 255, 0.25);
		-webkit-box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); }
	#collection .qrcap { margin-top: 10px; font-size: 15px; font-weight: 700; color: #f1f2f4; white-space: nowrap; }
	#collection .url { margin-top: 4px; font-size: 11px; color: #d4a24a; word-wrap: break-word; }
	/* Narrow windows: put the button above the logo instead of over it. */
	@media (max-width: 900px) {
		#collection { position: static; margin-bottom: 24px; }
		#brand { font-size: 56px; }
		#tipbox { bottom: 150px; }
		#percent { position: static; margin-bottom: 4px; }
		#status { margin-right: 0; }
	}
</style>
</head>
<body>
<div id="bg"></div>
<div id="scan"></div>
<div id="wrap">
	<!-- Clicks don't reach the page while Garry's Mod is loading, so the
	     collection is offered as a QR code to scan with a phone. -->
	<div id="collection">
		<img id="qr" alt="모음집 QR" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA5AAAAOQAgMAAAAyIna3AAAACVBMVEX////IMS8ODxKZRVtXAAAJ3UlEQVR42u3dPXJbuRIG0KZLzhXMgrgEBxYWCU3gJXA/40C5VMUXvBmPinMBNG0RIOnzJbbES5rHbEls4S9CRERERERERERERERERERERERERERERERERERE5L6yO/3EU+fi54ioEVH+/njr73Xjfu8/v3X9+89lrimJ5/k+n36HVxISEhISEhISEhISEnJuHjL92GmfWU/+XjZ6xve94GmPedp71k7v2etTR89TuUJCQkJCQkJCQkJCQs7tJ0/7sufGNaf9Yjm5LQZjjaXRn27dv9VTZp6ncoWEhISEhISEhISEhJzXT0anh+yNM/b6x9P7R6Ov3OodS+f+XklISEhISEhISEhISMjr7yd7Y4i1sR4yGh+f9otl8BjFKwkJCQkJCQkJCQkJCXn1/eRzspfcWkPZ6gFL43Hqxpjm1prKcsbzVK6QkJCQkJCQkJCQkJDz+8mnGM95rY0/o/P5SFxXB/vwvL//k1cSEhISEhISEhISEhIyruW8kDhzrmtrPmtJjmn2Ps6MT3olISEhISEhISEhISEh46rmu2b6udrZq2fUI8ZgPWUk1lNGcp2lcoWEhISEhISEhISEhJzXT7b2bY3OeR91sIdr7fSdvfMsW4/T6luVKyQkJCQkJCQkJCQkZCyZ71oH81Vr42zJSJ4b0hv7rIN1mtnHVK6QkJCQkJCQkJCQkJCxbL5r6Ywv1sE82dEc1foL51xufa505tAqV0hISEhISEhISEhIyMv3k1tndrR6uRjs29pbB9nb56cO1nP2xjWLcoWEhISEhISEhISEhIyV8117++tk98SpiTHJ1rhnGYyZ1sG5JMoVEhISEhISEhISEhJybj852pO1JMYos/volESPGMn5sGH9JCQkJCQkJCQkJCQk5NXsx1MH+7PWQZ+Y6UFjcBZJ9vHNd4WEhISEhISEhISEhIzl6ydjMFe1DvZ6zYxnjua1jvZ3HY1xKldISEhISEhISEhISMi5/WTp9HTv+73RWspe6uC20vg3emdTvr9NuUJCQkJCQkJCQkJCQsaS9ZPRWMdYkv1hOXNv1syZlaN+tPc8lSskJCQkJCQkJCQkJOT8/V2z50j+7FhlNOaw9tZxxpnrM5UrJCQkJGR88DnNH/rD+Gvzptdvd/JKdozx+cudIL/2bvy8vwvk5/7Nf9wFclCQu/0dfOPZRRz/7H1NPt7BK/lHzxiv30blfBPIfXzv3fwasV9WrqM1i9lxx10cD91n8O3LY3bsc+vxM2Oany7/v/i9f8Hr5b8vXBz5GIfBFYfdzSP3x9EVLxf/ovx08R8g30eXvF78h8ini39JHobXHB60WtePfDyOr3nZ3Thy/za+5u3S33kuXq4v40uON16uu+wP09t+JQ8fdM0VIx/iGhq+S7+Sxw/6uvVzcjHy8S1z1dtu4RdNSZwhcrrWMQZjhTFYN5l5Hr35t8YnIX/+Xd1L7lvw/vbHQuKpecuzcoWEhISEhISEhIxf/HVaHdyxNQ/15E3rX4fMe9e/L8ust6w/8VyUKyQkJCQkJCQkJCQkZEyf7xqDscnY2H91POLxtDnafrp/a2t8tCTPqVz7Sv6Ykf39jsv1cdbkloXIH6skXu/4G8/DrLktK5GTq3UJcna1LkHOrtYlyH8Wbx0P94vc/TuZ936R06t1BXJ6tS5Azq/WBcgfK1+/3TFyP2t6/ULk5Aak3U/Wxh6t55wfWX7iLV3p7AsUyTMw6zW8kguqdTpyRbVOR85uQFYgpzcgK5Dz39ItQC6p1snINdU6GbmmWicj5zcg85ELGpD5yEXVOhe5qFqnIldV61TkgnZ5PnJFA7LdT9Yz1iWWzn45/32cfrWe9o6jtZjljDm6n36Dap2JXFatE 		<div class="qrcap">휴대폰으로 찍어서 모음집 구독</div>
		<div class="url">steamcommunity.com/sharedfiles/filedetails/?id=3737337586</div>
	</div>

	<div id="brand">Z-<span>CITY</span></div>
	<div id="tagline">한국어 서버 · Korean Localization</div>

	<div id="details">
		<div class="detail"><div class="label">서버</div><div class="value" id="server">Z-City</div></div>
		<div class="detail"><div class="label">맵</div><div class="value" id="map">-</div></div>
		<div class="detail"><div class="label">최대 인원</div><div class="value" id="players">-</div></div>
	</div>

	<div id="tipbox">
		<div id="tiptitle">TIP</div>
		<div id="tip"></div>
	</div>

	<div id="bottom">
		<div id="percent"></div>
		<div id="status">서버에 접속하는 중...</div>
		<div id="file">&nbsp;</div>
		<div id="bar"><div id="fill"></div></div>
		<div id="hint">처음 접속할 때는 콘텐츠를 받느라 오래 걸릴 수 있습니다. 오른쪽 위 QR 코드를 휴대폰으로 찍어 모음집을 구독하면 다음부터 훨씬 빨라집니다.</div>
	</div>
</div>

<script>
	var TIPS = [
		"알포인트: 분대 안에 씐 자가 숨어 있습니다. 마지막에 열리는 철수 지점에 살아서 도착하세요.",
		"존 윅: 근접무기를 들고 우클릭하면 조준한 암살자에게 유도되는 투척을 합니다.",
		"존 윅: CZ75는 한 번 당기면 두 발이 나갑니다. 정밀 사격이면 심장과 머리를 노립니다.",
		"공포모드: 죽은 뒤에도 좌클릭으로 유령이 되어 생존자를 괴롭힐 수 있습니다.",
		"좀비모드: 감염되면 숫자 키로 좀비 종류를 고르고, G로 질주합니다.",
		"배틀그라운드: 나침반과 미니맵에 다음 자기장, 보급, 레드존이 표시됩니다.",
		"레이븐홈 / 17번 지구: 좀비와 시민보호 기동대를 피해 끝까지 살아남으세요.",
		"전체 채팅은 메시지 앞에 // 를 붙이면 1분에 한 번 보낼 수 있습니다.",
		"라운드가 끝나면 거리와 상관없이 모두와 채팅·음성 대화를 할 수 있습니다.",
		"2차대전 독일·소련 총기가 추가되었습니다."
	];
	var tipIndex = Math.floor(Math.random() * TIPS.length);

	// Progress: Garry's Mod only reports file counts for the FastDL step, which made
	// the bar sit at 1% through the workshop step and then jump. The load is split
	// into stages (recognised from the status text) with a share of the bar each;
	// inside a stage the bar follows real counts when there are any (workshop
	// "3/57", files left) and otherwise creeps slowly towards the stage's end, so
	// it always moves and never goes backwards. It stops short of 100%: the screen
	// closes when loading is done.
	var STAGES = [
		{ name: "접속", from: 0, to: 4, tau: 4 },
		{ name: "워크샵 애드온", from: 4, to: 55, tau: 40 },
		{ name: "서버 정보", from: 55, to: 60, tau: 4 },
		{ name: "파일 받기", from: 60, to: 80, tau: 15 },
		{ name: "Lua 받기", from: 80, to: 92, tau: 10 },
		{ name: "게임 시작", from: 92, to: 99, tau: 12 }
	];
	var stage = 0;
	var stageStart = new Date().getTime();
	var shown = 0;
	var totalFiles = 0;
	var neededFiles = 0;
	var downloaded = 0;
	var wsDone = 0, wsTotal = 0, wsItemPct = 0, wsChanged = 0;

	function now() { return new Date().getTime(); }
	function byId(id) { return document.getElementById(id); }
	function setText(id, text) { var el = byId(id); if (el) { el.innerHTML = ""; el.appendChild(document.createTextNode(text)); } }

	function showTip() {
		var el = byId("tip");
		el.style.opacity = 0;
		setTimeout(function () {
			setText("tip", TIPS[tipIndex]);
			el.style.opacity = 1;
			tipIndex = (tipIndex + 1) % TIPS.length;
		}, 450);
	}

	function goStage(i) {
		if (i > stage && i < STAGES.length) { stage = i; stageStart = now(); }
	}

	// 0..1 that approaches 1 over time (never reaches it).
	function creep(sinceMs, tau) { return 1 - Math.exp(-sinceMs / 1000 / tau); }

	// How far through the current stage we are, 0..1.
	function stageFraction() {
		var s = STAGES[stage], t = now();
		if (stage === 1 && wsTotal > 0) {
			// Finished addons, plus the current one (its own % if given, else creeping).
			var item = wsItemPct > 0 ? wsItemPct / 100 : creep(t - wsChanged, 8) * 0.9;
			return Math.min((Math.max(wsDone - 1, 0) + item) / wsTotal, 1);
		}
		if (stage === 3 && totalFiles > 0) {
			var done = Math.max(totalFiles - neededFiles, downloaded, 0);
			var f = Math.min(done / totalFiles, 1);
			// Creep a little towards the next file so long downloads don't look stuck.
			return Math.min(f + (1 - f) * creep(t - stageStart, s.tau) * 0.15, 1);
		}
		return creep(t - stageStart, s.tau) * 0.95;
	}

	function render() {
		var s = STAGES[stage];
		var target = s.from + (s.to - s.from) * stageFraction();
		// Glide towards the target; only ever forwards.
		if (target > shown) shown = Math.min(shown + Math.max((target - shown) * 0.2, 0.05), target);
		if (shown > 99) shown = 99;
		byId("fill").style.width = shown.toFixed(1) + "%";

		var detail = s.name + " (" + (stage + 1) + "/" + STAGES.length + ")";
		if (stage === 1 && wsTotal > 0) detail = s.name + " " + wsDone + " / " + wsTotal;
		if (stage === 3 && totalFiles > 0) detail = s.name + " " + Math.max(totalFiles - neededFiles, downloaded, 0) + " / " + totalFiles;
		setText("percent", Math.floor(shown) + "%  ·  " + detail);
	}

	// Which stage a status text belongs to (-1: can't tell, keep the current one).
	function stageOf(text) {
		// Workshop lines start with a counter; quoted addon names are left out of the
		// keyword check (a name like 'Lua Vehicles' must not look like the Lua step).
		if (/^\s*\d+\s*\/\s*\d+/.test(text)) return 1;
		var t = text.replace(/'[^']*'|"[^"]*"/g, "").toLowerCase();
		if (/lua started|parsing game|game info|precach/.test(t)) return 5;
		if (/lua|received all|no files to request/.test(t)) return 4;
		if (/client info|sending/.test(t)) return 2;
		if (/workshop complete/.test(t)) return 2;
		if (/^\s*\d+\s*\/\s*\d+|workshop|addon|mount|워크샵|애드온/.test(t)) return 1;
		// Before the server-info step a download is a workshop addon, after it a FastDL file.
		if (/download|files|파일/.test(t)) return stage < 2 ? 1 : 3;
		if (/retriev|server info|connect|접속/.test(t)) return 0;
		return -1;
	}

	// Called by Garry's Mod.
	function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
		if (servername) setText("server", servername);
		if (mapname) setText("map", mapname);
		if (maxplayers) setText("players", maxplayers + "명");
	}
	function SetFilesTotal(total) {
		totalFiles = Number(total) || 0;
		if (totalFiles > 0 && stage >= 2) goStage(3);
	}
	function SetFilesNeeded(needed) {
		neededFiles = Number(needed) || 0;
		if (neededFiles > 0 && stage >= 2) goStage(3);
	}
	function DownloadingFile(fileName) {
		downloaded++;
		setText("file", "받는 중: " + fileName);
		if (stage >= 2) goStage(3);
	}
	function SetStatusChanged(status) {
		if (!status) return;
		setText("status", status);
		var text = String(status);
		var i = stageOf(text);
		if (i >= 0) goStage(i);
		if (stage === 1) {
			// "3/57 (12.4 MB) - Downloading 'name'": counts only from the start of the
			// text (addon names can contain "1/3" themselves).
			var m = /^\s*(\d+)\s*\/\s*(\d+)/.exec(text);
			if (m) {
				var d = Number(m[1]), n = Number(m[2]);
				if (n > 0 && (d !== wsDone || n !== wsTotal)) { wsDone = d; wsTotal = n; wsChanged = now(); wsItemPct = 0; }
			}
			var p = /(\d{1,3})\s*%/.exec(text);
			if (p) wsItemPct = Math.min(Number(p[1]), 100);
		}
	}

	showTip();
	setInterval(showTip, 7000);
	render();
	setInterval(render, 100);
</script>
</body>
</html>
